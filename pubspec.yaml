  google_ml_kit_object_detection: ^0.15.1
  google_ml_kit_commons: ^0.11.1

  # utilidades
  crypto: ^3.0.7
  intl: ^0.20.2
  shared_preferences: ^2.5.5
  image_picker: ^1.2.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/ml/
