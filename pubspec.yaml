name: ecoscan_rewards
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  google_fonts: ^8.0.2

  # estado
  provider: ^6.1.5+1

  # BD
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # Cámara y ML Kit
  camera: ^0.12.0+1
